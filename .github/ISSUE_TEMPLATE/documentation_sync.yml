name: Documentation sync
description: Manually trigger either a full Styr manual regeneration or an incremental release documentation synchronization.
title: "Documentation sync: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is the explicit manual trigger for Styr user documentation. Start with the **Styr Release Documentation Analyst**, then hand the resulting impact set to the **Styr Manual SME**. No documentation agent may merge directly into the base branch.

  - type: dropdown
    id: mode
    attributes:
      label: Documentation mode
      description: Full regeneration reconstructs the complete current en-US manual; incremental release sync preserves the existing manual and patches only the release delta plus transitively affected sections.
      options:
        - full-regeneration
        - incremental-release-sync
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target release, milestone, or ref
      description: The branch, release candidate, planned tag, or commit whose behavior must be documented.
      placeholder: "main, v0.2.0-rc1, or a commit SHA"
    validations:
      required: true

  - type: input
    id: baseline
    attributes:
      label: Previous release / comparison baseline
      description: Required for incremental-release-sync. Optional for full-regeneration; when supplied it may be used to reconstruct What's New for exactly that interval.
      placeholder: "v0.1.47"

  - type: input
    id: branch
    attributes:
      label: Base branch
      description: Branch that will receive the reviewed documentation PR.
      placeholder: "main"
    validations:
      required: true

  - type: textarea
    id: emphasis
    attributes:
      label: Known documentation focus
      description: Optional areas that deserve special attention. This never limits the analyst's responsibility to inspect the complete target coverage or release delta.
      placeholder: "Clock/external sync, Note microtiming, Curve Track changes..."

  - type: checkboxes
    id: contract
    attributes:
      label: Documentation contract
      options:
        - label: Use US English (en-US) as the current canonical and only active source locale.
          required: true
        - label: Treat the result as one bundled documentation update, not isolated per-commit edits.
          required: true
        - label: In incremental mode, preserve unaffected structure, stable IDs/paths, and unaffected prose.
          required: true
        - label: In full-regeneration mode, treat the regenerated result as review material rather than an automatic replacement of the maintained manual.
          required: true
        - label: Do not change product behavior or merge directly into the base branch.
          required: true
        - label: Run the manual screenshot mapping validation before review.
          required: true
