name: Manual publication smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/manual/**"
      - "toolchain/manual/**"
      - "toolchain/tests/test_manual_tooling.py"
      - ".github/workflows/manual-publication.yml"
  pull_request:
    paths:
      - "docs/manual/**"
      - "toolchain/manual/**"
      - "toolchain/tests/test_manual_tooling.py"
      - ".github/workflows/manual-publication.yml"

permissions:
  contents: read

jobs:
  publication-smoke:
    name: Markdown -> ODT -> PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fontconfig poppler-utils

      - name: Validate manual publication contract
        run: python toolchain/manual/check_manual_pipeline.py

      - name: Test manual publication tooling
        run: python -m unittest toolchain.tests.test_manual_tooling -v

      - name: Fetch pinned Ubuntu build fonts
        run: python toolchain/manual/fetch_ubuntu_fonts.py

      - name: Build styled publication smoke manual
        run: >-
          python toolchain/manual/build_manual.py
          --smoke
          --version 0.0.0-ci
          --output-dir "${{ runner.temp }}/styr-manual-smoke"

      - name: Validate ODT and PDF artifacts
        run: >-
          python toolchain/manual/check_manual_artifact.py
          --odt "${{ runner.temp }}/styr-manual-smoke/styr-user-manual.en.0.0.0-ci.odt"
          --pdf "${{ runner.temp }}/styr-manual-smoke/styr-user-manual.en.0.0.0-ci.pdf"
          --version 0.0.0-ci
          --locale en-US
          --language-code en

      - name: Upload manual smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: styr-manual-publication-smoke
          path: |
            ${{ runner.temp }}/styr-manual-smoke/styr-user-manual.en.0.0.0-ci.odt
            ${{ runner.temp }}/styr-manual-smoke/styr-user-manual.en.0.0.0-ci.pdf
          if-no-files-found: error
