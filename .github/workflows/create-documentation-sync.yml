name: Create documentation sync control issue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Documentation mode
        required: true
        type: choice
        options:
          - full-regeneration
          - incremental-release-sync
      target:
        description: Target release, milestone, branch, tag, or commit
        required: true
        type: string
      baseline:
        description: Previous release / comparison baseline (required for incremental mode)
        required: false
        type: string
      base_branch:
        description: Branch that will receive the final reviewed documentation PR
        required: true
        default: main
        type: string
      emphasis:
        description: Optional documentation focus; does not limit full coverage responsibility
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    name: Create authorized documentation sync control issue
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [ "$MODE" = "incremental-release-sync" ] && [ -z "$BASELINE" ]; then
            echo "baseline is required for incremental-release-sync" >&2
            exit 1
          fi

      - name: Ensure internal labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "internal:documentation-sync" \
            --repo "$GH_REPO" \
            --color "5319E7" \
            --description "Maintainer-authorized documentation-agent synchronization control issue" \
            --force
          gh label create "documentation" \
            --repo "$GH_REPO" \
            --color "0075CA" \
            --description "Documentation work" \
            --force

      - name: Create authorized control issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          BASELINE: ${{ inputs.baseline }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          EMPHASIS: ${{ inputs.emphasis }}
          ACTOR: ${{ github.actor }}
        run: |
          issue_url="$(gh issue create \
            --repo "$GH_REPO" \
            --title "Documentation sync: $TARGET" \
            --label "internal:documentation-sync" \
            --label "documentation" \
            --body "Initializing authorized documentation-sync control issue...")"
          issue_number="${issue_url##*/}"
          export ISSUE_NUMBER="$issue_number"

          python - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent

          issue = os.environ["ISSUE_NUMBER"]
          baseline = os.environ.get("BASELINE", "").strip() or "(not supplied)"
          emphasis = os.environ.get("EMPHASIS", "").strip() or "(none specified)"
          body = dedent(f"""\
          ## Authorized documentation sync

          This issue was created by the maintainer-only **Create documentation sync control issue** workflow and is authorized for the Styr documentation-agent process.

          - **Sync issue:** `#{issue}`
          - **Mode:** `{os.environ['MODE']}`
          - **Target:** `{os.environ['TARGET']}`
          - **Previous release / baseline:** `{baseline}`
          - **Final PR base branch:** `{os.environ['BASE_BRANCH']}`
          - **Requested by:** `@{os.environ['ACTOR']}`

          ## Known documentation focus

          {emphasis}

          ## Start the documentation pipeline

          Assign this issue **once** to the custom agent **Styr Documentation Orchestrator**.

          That is the only maintainer handoff required. GitHub will create one Draft PR for the assigned task. The Orchestrator will then invoke the internal specialist agents in order using the custom-agent `agent` tool:

          1. **Styr Release Documentation Analyst**
          2. **Styr Manual SME**
          3. **Styr Manual UX and Information Architecture Reviewer**
          4. **Styr Manual Technical Reviewer**
          5. **Styr Manual US English Editor**

          The specialist agents are programmatic-only and must not be started manually. They work in the same task/worktree and return structured handoffs to the Orchestrator; internal analysis handoffs are not committed as repository files. For `full-regeneration`, the Orchestrator also regenerates the complete deterministic screenshot corpus before analysis and again after authoring/UX review. Before Technical Review, the complete screenshot corpus is regenerated for either mode.

          ## Expected result

          The existing Draft PR created by this issue assignment becomes the single bundled documentation PR. The Orchestrator leaves it ready for deterministic CI and human review after all specialist stages succeed.

          If a factual technical review is blocked, the pipeline stops for human intervention rather than letting editorial work hide the problem.

          ## Contract

          - US English (`en-US`) is the current canonical and only active source locale.
          - Treat the result as one bundled documentation update, not isolated per-commit edits.
          - In `incremental-release-sync`, preserve unaffected structure, stable IDs/paths, and unaffected prose. `What's New` covers only `{baseline}` to `{os.environ['TARGET']}`.
          - In `full-regeneration`, reconstruct complete current en-US user documentation from verified repository evidence, preserve or restore better existing prose where it remains correct, and regenerate all manual screenshots; the result remains review material until human approval.
          - Do not change product behavior merely to make documentation agree with it.
          - Do not commit internal handoff artifacts under `.github/documentation-sync/work/`, `docs/analysis/`, or root `PROVENANCE.md`.
          - Public issues, comments, or copied versions of this body without the `internal:documentation-sync` label are not authorized agent triggers.
          - Agents do not merge. Deterministic CI and human review are required before merge.
          """)
          Path("documentation-sync-body.md").write_text(body, encoding="utf-8")
          PY

          gh issue edit "$issue_number" \
            --repo "$GH_REPO" \
            --body-file documentation-sync-body.md

          echo "Created authorized documentation-sync control issue: $issue_url"
