[platformio]
default_envs = application
src_dir = src
boards_dir = toolchain/boards
build_dir = .pio/build

; The embedded build is deliberately framework-free. The pinned legacy
; libopencm3 source is fetched once and compiled explicitly by a PRE build
; adapter until it is modernized in a later, independent step.
[env]
platform = platformio/ststm32@19.7.0
board = styr_performer_f405
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.60301.0
    platformio/tool-openocd@3.1200.7
extra_scripts =
    pre:toolchain/scripts/platformio/libopencm3.py
    pre:toolchain/scripts/platformio/styr_build.py
    post:toolchain/scripts/platformio/artifacts.py
build_type = release
build_unflags =
    -Os
    -fno-rtti
    -fno-exceptions
    -Wl,--gc-sections,--relax
build_flags =
    -O2
    -g
    -Wall
    -fdata-sections
    -ffunction-sections
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -mthumb-interwork
    -funroll-loops
    -fshort-enums
    -DPLATFORM_STM32
    -DSTM32F4
    -DSTM32F405xx
upload_protocol = stlink
debug_tool = stlink
lib_ldf_mode = off

[env:application]
build_src_filter =
    +<sequencer/main.cpp>
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 983040
custom_styr_components = sequencer,runtime
custom_styr_ldscript = toolchain/linker/application.ld
custom_styr_artifact_name = styr
custom_styr_sd_update = yes

[env:application_standalone]
build_src_filter =
    +<sequencer/main.cpp>
board_upload.offset_address = 0x08000000
board_upload.maximum_size = 1048576
custom_styr_components = sequencer,runtime
custom_styr_ldscript = toolchain/linker/application_standalone.ld
custom_styr_artifact_name = styr_standalone

[env:bootloader]
build_src_filter =
    +<bootloader/*.cpp>
board_upload.offset_address = 0x08000000
board_upload.maximum_size = 32768
custom_styr_components = bootloader
custom_styr_ldscript = toolchain/linker/bootloader.ld
custom_styr_artifact_name = bootloader
; Unlike the sequencer, the bootloader uses neither RTTI nor C++ exceptions.
; Do not inherit the global unflags here: retaining PlatformIO's bare-metal
; -fno-rtti/-fno-exceptions and linker relaxation is important for the fixed
; 32 KiB bootloader partition. Also drop the application-wide loop-unrolling
; flag here: explicit unrolling works against the bootloader's size objective.
build_unflags =
    -Os
    -O2
    -funroll-loops
build_flags =
    ${env.build_flags}
    -Os
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Isrc/bootloader
    -Ithird_party/embedded/bootloader/md5

[env:tester]
build_src_filter =
    +<tester/Tester.cpp>
board_upload.offset_address = 0x08010000
board_upload.maximum_size = 983040
custom_styr_components = runtime
custom_styr_ldscript = toolchain/linker/tester.ld
custom_styr_artifact_name = tester

[env:tester_standalone]
build_src_filter =
    +<tester/Tester.cpp>
board_upload.offset_address = 0x08000000
board_upload.maximum_size = 1048576
custom_styr_components = runtime
custom_styr_ldscript = toolchain/linker/tester_standalone.ld
custom_styr_artifact_name = tester_standalone

; HWCONFIG is intentionally independent of the firmware runtime. These targets
; only place HardwareConfigData at 0x08008000.
[hwconfig]
build_src_filter =
    +<hwconfig/hwconfig.c>
board_upload.offset_address = 0x08008000
board_upload.maximum_size = 16384
custom_styr_components =
custom_styr_ldscript = toolchain/linker/hwconfig.ld
build_unflags =
    -Os
    -fno-rtti
    -fno-exceptions
    -Wl,--gc-sections,--relax

[env:hwconfig_default]
build_src_filter = ${hwconfig.build_src_filter}
board_upload.offset_address = ${hwconfig.board_upload.offset_address}
board_upload.maximum_size = ${hwconfig.board_upload.maximum_size}
custom_styr_components = ${hwconfig.custom_styr_components}
custom_styr_ldscript = ${hwconfig.custom_styr_ldscript}
build_unflags = ${hwconfig.build_unflags}
custom_styr_artifact_name = hwconfig_default
build_flags =
    ${env.build_flags}
    -DREVERSE_ENCODER=0
    -DINVERT_LEDS=0
    -DDAC_TYPE=0

[env:hwconfig_dac8568a]
build_src_filter = ${hwconfig.build_src_filter}
board_upload.offset_address = ${hwconfig.board_upload.offset_address}
board_upload.maximum_size = ${hwconfig.board_upload.maximum_size}
custom_styr_components = ${hwconfig.custom_styr_components}
